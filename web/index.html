<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17202a">
    <title>Hex Chess</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="layout">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL GAME</p>
          <h1>Hex Chess</h1>
        </div>
        <p id="turn" class="turn-badge" aria-live="polite">Connecting…</p>
      </header>

      <section class="game">
        <div class="board-frame">
          <svg id="board" viewBox="0 0 760 760" role="img" aria-label="Hex chess board"></svg>
        </div>
        <aside class="controls">
          <h2>Your move</h2>
          <p id="status" role="status" aria-live="polite">Connecting to the local game…</p>
          <div class="buttons">
            <button id="rotate" type="button" disabled>Rotate 60°</button>
            <button id="reset" type="button" disabled>Reset</button>
            <button id="send" class="send" type="button" disabled>Send move</button>
          </div>
          <div class="legend">
            <p><span class="swatch blue"></span> Blue / true</p>
            <p><span class="swatch orange"></span> Orange / false</p>
            <p>Drag a piece or king to a highlighted destination. Piece lines show its movement directions.</p>
          </div>
        </aside>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
